services:
  web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${CONFIG}/web:/config:Z
      - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
      - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z
    env_file:
      - .env
    networks:
      meet.jitsi:
    depends_on:
      - jvb

  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable}
    restart: ${RESTART_POLICY:-unless-stopped}
    expose:
      - "5222"
      - "5269"
      - "5347"
      - "5280"
    volumes:
      - ${CONFIG}/prosody/config:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    env_file:
      - .env
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "127.0.0.1:${JICOFO_REST_PORT:-8888}:8888"
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    env_file:
      - .env
    networks:
      meet.jitsi:
    depends_on:
      - prosody

  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      - "127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080"
    volumes:
      - ${CONFIG}/jvb:/config:Z
    env_file:
      - .env
    networks:
      meet.jitsi:
    depends_on:
      - prosody

  jibri:
    image: jitsi/jibri:${JITSI_IMAGE_VERSION:-stable}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ${CONFIG}/jibri:/config:Z
      - recordings_data:/recordings
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    env_file:
      - .env
    networks:
      meet.jitsi:
    depends_on:
      - jicofo

  backend:
    image: node:22-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    working_dir: /app
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - recordings_data:/recordings
      - ../apps/backend:/app
    environment:
      RECORDINGS_DIR: /recordings
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-monitor}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      DATABASE_NAME: ${POSTGRES_DB:-monitor}
    networks:
      backend:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  meet.jitsi:
  backend:

volumes:
  recordings_data:
  postgres_data:
